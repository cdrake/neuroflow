[package]
name = "neuroflow-wasm"
version = "0.7.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
neuroflow-core = { path = "../neuroflow-core" }
serde_json = "1"
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
# wasm-pack runs wasm-opt -O by default; also drop the producers section (see scripts/wasm-build.mjs).
wasm-opt = ["-O", "--strip-producers"]
