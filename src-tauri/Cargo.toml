[package]
name = "neuroflow-tauri"
version = "0.1.0"
description = "NeuroFlow desktop host"
edition = "2021"

[lib]
name = "neuroflow_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
neuroflow-core = { path = "../crates/neuroflow-core" }
neuroflow-mcp = { path = "../crates/neuroflow-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
